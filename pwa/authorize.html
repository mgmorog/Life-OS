<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F4EF">
<meta name="robots" content="noindex">
<title>Connect Claude to Life OS</title>
<style>
:root{color-scheme:light;--bg:#f4f4ef;--card:#fff;--ink:#1f2623;--ink2:#68716c;--line:#ebe8e1;--green:#3f6b57;--pale:#e2ece6}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:24px}
.card{width:min(420px,100%);background:var(--card);border-radius:24px;padding:28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(30,40,35,.08)}
.mark{width:52px;height:52px;border-radius:50%;background:var(--pale);display:grid;place-items:center;margin-bottom:14px}.mark i{width:18px;height:18px;border-radius:50%;background:var(--green)}
h1{font:400 28px/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}p{margin:0 0 14px;color:var(--ink2)}
ul{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line)}li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}li b{font-weight:500}li span{color:var(--ink2);font-size:14px}
.btn{display:block;width:100%;height:50px;border:0;border-radius:999px;font:600 16px inherit;font-family:inherit;cursor:pointer;margin-top:10px}
.pri{background:var(--green);color:#fff}.sec{background:var(--bg);color:var(--green)}.btn:disabled{opacity:.6}
.who{font-size:14px;color:var(--ink2);margin-top:14px;text-align:center}.err{color:#a3402a}
</style>
</head>
<body>
<main class="card" id="c" aria-live="polite"><div class="mark" aria-hidden="true"><i></i></div><h1>Life OS</h1><p>Checking…</p></main>
<script>
(()=>{
  const q=new URLSearchParams(location.search),c=document.getElementById('c');
  const P=k=>q.get(k)||'';
  const esc=s=>String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
  const back=(params)=>{const u=new URL(P('redirect_uri'));Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));if(P('state'))u.searchParams.set('state',P('state'));location.replace(u.toString());};
  const show=(h)=>{c.innerHTML='<div class="mark" aria-hidden="true"><i></i></div>'+h;};
  const sess=()=>{try{const s=JSON.parse(localStorage.getItem('lifeos-auth')||'null');return s&&(s.access_token||s.currentSession)?(s.currentSession||s):null;}catch(e){return null;}};
  if(P('response_type')!=='code'||!P('client_id')||!P('redirect_uri')){show('<h1>Something’s missing</h1><p class="err">Start connecting again from Claude.</p>');return;}
  fetch('/api/oauth?x=client&client_id='+encodeURIComponent(P('client_id'))+'&redirect_uri='+encodeURIComponent(P('redirect_uri'))).then(r=>r.json().then(j=>[r.ok,j])).then(([ok,j])=>{
    if(!ok){show('<h1>Can’t connect</h1><p class="err">'+esc(j.error_description||'Start again from Claude.')+'</p>');return;}
    const s=sess(),name=j.name||'Claude';
    if(!s){show('<h1>Sign in to Life OS first</h1><p>'+esc(name)+' wants to connect to your Life OS. Sign in to Life OS in this browser, then you’ll come right back here.</p><button class="btn pri" id="si">Sign in to Life OS</button><button class="btn sec" id="no">Cancel</button>');
      document.getElementById('si').onclick=()=>{try{localStorage.setItem('lifeos-oauth-return',JSON.stringify({url:location.href,at:Date.now()}));}catch(e){}location.href='/';};
      document.getElementById('no').onclick=()=>back({error:'access_denied'});return;}
    const email=(s.user&&s.user.email)||'';
    show('<h1>Connect '+esc(name)+' to Life OS?</h1><p>'+esc(name)+' will be able to:</p><ul><li><div><b>See your plans</b><br><span>Tasks, habits, goals, projects, lists, calendar and life areas</span></div></li><li><div><b>Make changes you ask for</b><br><span>Each one shows in your Autopilot log with Undo</span></div></li><li><div><b>Only what you allow</b><br><span>Choose areas to hide or keep read-only in Settings › Claude</span></div></li></ul><button class="btn pri" id="ok">Allow</button><button class="btn sec" id="no">Cancel</button>'+(email?'<p class="who">Signed in as '+esc(email)+'</p>':''));
    document.getElementById('no').onclick=()=>back({error:'access_denied'});
    document.getElementById('ok').onclick=async e=>{e.currentTarget.disabled=true;e.currentTarget.textContent='Connecting…';
      const body={client_id:P('client_id'),redirect_uri:P('redirect_uri'),state:P('state'),code_challenge:P('code_challenge'),code_challenge_method:P('code_challenge_method'),scope:P('scope'),resource:P('resource'),refresh_token:s.refresh_token||''};
      const r=await fetch('/api/oauth?x=approve',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+(s.access_token||'')},body:JSON.stringify(body)}).catch(()=>null);
      const j2=r?await r.json().catch(()=>({})):{};if(r&&r.ok&&j2.redirect){location.replace(j2.redirect);return;}
      show('<h1>Couldn’t connect</h1><p class="err">'+esc(j2.error_description||'Check your connection and try again.')+'</p><button class="btn pri" onclick="location.reload()">Try again</button>');};
  }).catch(()=>show('<h1>Offline</h1><p class="err">Check your connection and try again.</p>'));
})();
</script>
</body>
</html>
