<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F4EF">
<title>Shared list · Life OS</title>
<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Newsreader";font-weight:200 800;font-display:swap;src:url(/fonts/newsreader.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
:root{--bg:#F4F4EF;--card:#fff;--ink:#1E2622;--ink2:#5B6560;--line:#E5E7E1;--line2:#EFF0EA;--acc:#466B5A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 Figtree,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 48px}
h1{font:500 34px/1.1 Newsreader,Georgia,serif;margin:8px 0 4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 18px}
.sec{font-weight:600;color:var(--ink2);font-size:15px;margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
button.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
button.row:last-child{border-bottom:0}
button.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tick{width:22px;height:22px;border-radius:999px;border:2px solid #C9CDC7;flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.row.d .tick{background:var(--acc);border-color:var(--acc)}
.row.d .t{color:var(--ink2);text-decoration:line-through}
.tick svg{opacity:0;transition:opacity .2s}.row.d .tick svg{opacity:1}
.msg{color:var(--ink2);text-align:center;padding:48px 16px}
.foot{color:var(--ink2);font-size:13px;text-align:center;margin-top:20px}
.by{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
#add{max-width:560px;margin:-36px auto 0;padding:0 16px 48px}
#add form{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 8px 0 16px;min-height:52px}
#add form:focus-within{border-color:var(--acc)}
#add .plus{width:24px;height:24px;border-radius:999px;border:1.6px dashed #A9B0AA;display:grid;place-items:center;color:var(--acc);flex:none;font-weight:700}
#add input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:12px 0}
#add button{all:unset;cursor:pointer;color:var(--acc);font-weight:600;padding:8px 10px;border-radius:10px}
#add .who{color:var(--ink2);font-size:13px;margin:8px 6px 0}
#add .who button{color:var(--acc);font-size:13px;padding:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="m"><p class="msg">Loading…</p></main>
<div id="add" hidden><form autocomplete="off"><span class="plus" aria-hidden="true">+</span><input id="addin" placeholder="Add an item" aria-label="Add an item" enterkeyhint="done" maxlength="200"><button type="submit">Add</button></form><p class="who"></p><p class="foot">Anyone with this link can add items and check them off. Changes show up for the owner right away.</p></div>
<script>
{
const tok = location.pathname.split('/').filter(Boolean)[1] || '';
const m = document.getElementById('m');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
let data = null, busy = false;
const rowHtml = i => `<button class="row${i.d ? ' d' : ''}" data-id="${esc(i.id)}" role="checkbox" aria-checked="${i.d}"><span class="tick">${CHECK}</span><span><span class="t">${esc(i.t)}</span>${i.by ? `<span class="by">Added by ${esc(i.by)}</span>` : ''}</span></button>`;
function draw() {
  if (!data) return;
  document.title = data.title + ' · Life OS';
  const left = data.items.filter(i => !i.d).length;
  const groups = [{ id: null, name: '' }, ...data.sections].map(s => ({ s, items: data.items.filter(i => (i.sec || null) === s.id) })).filter(g => g.items.length);
  m.innerHTML = `<h1>${esc(data.title)}</h1><p class="sub">${data.items.length ? (left ? `${left} left` : 'All checked') : 'Empty'} · shared from Life OS</p>` +
    (groups.length ? groups.map(g => (g.s.name ? `<div class="sec">${esc(g.s.name)}</div>` : '') + `<div class="card">${g.items.map(rowHtml).join('')}</div>`).join('') : '<p class="msg">Nothing on this list yet.</p>') +
    '';
  addBox.hidden = false;
}
async function load() {
  try { const r = await fetch('/api/list?t=' + encodeURIComponent(tok)); if (r.status === 404) { m.innerHTML = '<p class="msg">This link has been turned off, or it isn’t right.</p>'; data = null; return; } data = await r.json(); if (!busy) draw(); }
  catch (e) { if (!data) m.innerHTML = '<p class="msg">Can’t reach Life OS. Check your connection.</p>'; }
}
m.addEventListener('click', async e => {
  const b = e.target.closest('button.row'); if (!b || !data) return;
  const it = data.items.find(i => i.id === b.dataset.id); if (!it) return;
  it.d = !it.d; busy = true; draw();
  try { const r = await fetch('/api/list', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: tok, id: it.id, d: it.d }) }); if (r.ok) data = await r.json(); }
  catch (err) { it.d = !it.d; }
  busy = false; draw();
});
const addBox = document.getElementById('add'), addIn = document.getElementById('addin'), who = addBox.querySelector('.who');
const nameOf = () => { try { return localStorage.getItem('lifeos-share-name') || ''; } catch (e) { return ''; } };
const drawWho = () => { const n = nameOf(); who.innerHTML = n ? `Adding as <b>${esc(n)}</b> · <button type="button">Change</button>` : ''; addIn.placeholder = n ? `Add an item, as ${n}` : 'Add an item'; };
const askName = () => { const n = (prompt('Your name, so the owner knows who added it (optional)', nameOf()) || '').trim().slice(0, 40); try { localStorage.setItem('lifeos-share-name', n || ' '); } catch (e) {} drawWho(); };
who.addEventListener('click', e => { if (e.target.closest('button')) askName(); });
addBox.querySelector('form').addEventListener('submit', async e => {
  e.preventDefault(); const t = addIn.value.trim(); if (!t || !data) return;
  try { if (localStorage.getItem('lifeos-share-name') == null) askName(); } catch (err) {}
  const by = nameOf().trim(); addIn.value = ''; busy = true;
  data.items.push({ id: 'tmp' + Date.now(), t, d: false, by: by || null, sec: null }); draw();
  try { const r = await fetch('/api/list', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: tok, add: t, by }) }); if (r.ok) data = await r.json(); else { addIn.value = t; } }
  catch (err) { addIn.value = t; }
  busy = false; draw(); addIn.focus();
});
drawWho();
load(); setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
}
</script>
</body>
</html>
